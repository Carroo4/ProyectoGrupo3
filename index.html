<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Colaborativo</title>
</head>
<body>
    <encabezado>
        <h2>Formulario de inscripción en cursos de FP</h2>
			<form action="php/datos.php" method="post" id="formu" name="formu">
			<h3>Datos personales</h3><hr><br>
			<label for="nombre">Nombre y apellidos</label><br>
			<input type="text" id="nombre" name="nombre" required ><br><br>
			<label for="fecha">Fecha de nacimiento</label><br>
			<input type="date" id="fecha" name="fecha" required min="1926-01-01" max="2008-12-31" ><br><br>
			<label for="edad">Edad</label><br>
			<input type="number" id="edad" name="edad" min="17" max="100" required ><br><br>
    </encabezado>
    
    <cuerpo>
        <h2>Datos académicos</h2>
		<hr><br>
		<label for="ciclo">Selecciona el ciclo formativo</label><br>
		<select name="ciclo" id="ciclo" required>
			<option value="" disabled selected>-- Selecciona un curso --</option>
			<option value="SMR">Sistemas microinformáticos y redes</option>
			<option value="ASIR">Administración de sistemas informáticos en red</option>
			<option value="DAM">Desarrollo de aplicaciones multiplataforma</option>
			<option value="DAW">Desarrollo de aplicaciones web</option>
			<option value="MP">Marketing y publicidad</option>
			<option value="AF">Administración y finanzas</option>
		</select><br><br>
		
		<label for="modalidad">¿Qué modalidad prefieres?</label><br><br>
		<input type="radio" id="modalidad" name="modalidad" value="presencial" required >Presencial</input>
		<input type="radio" id="modalidad" name="modalidad" value="distancia" required >A distancia</input>
		<input type="radio" id="modalidad" name="modalidad" value="semi" required >Semipresencial</input><br><br>
    </cuerpo>
    
    <pie>
        <!-- Grupo 3: Rellenar esta sección -->
    </pie>
</body>
</html>
